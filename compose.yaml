services:
  baymax:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_TEST_GUILDS: ${DISCORD_TEST_GUILDS:-}
      GROK_WAKE_WEBHOOK_URL: ${GROK_WAKE_WEBHOOK_URL:-}
      GROK_WAKE_WEBHOOK_AUTH: ${GROK_WAKE_WEBHOOK_AUTH:-}
      GROK_WAKE_CHANNELS: ${GROK_WAKE_CHANNELS:-}
      GROK_WAKE_TARGET_USER_ID: ${GROK_WAKE_TARGET_USER_ID:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
